
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Black Gaming</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:20px;
}

.card{
  background:#222;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}

.unit{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#333;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}

button{
  background:red;
  color:white;
  border:0;
  border-radius:8px;
  font-size:22px;
  width:40px;
  height:40px;
}

.number{
  display:inline-block;
  width:35px;
  font-size:20px;
  font-weight:bold;
}

#total{
  font-size:25px;
  color:#ff3333;
  margin:20px;
}
</style>
</head>

<body>

<div class="card">

<h1>🔥 RED BLACK GAMING 🔥</h1>

<h2>🏰 TH17 Army Builder</h2>

<div class="unit">
<span>🌳 Root Rider</span>
<div>
<button onclick="minus('root')">−</button>
<span class="number" id="root">0</span>
<button onclick="plus('root')">+</button>
</div>
</div>

<div class="unit">
<span>⚔️ Valkyrie</span>
<div>
<button onclick="minus('valk')">−</button>
<span class="number" id="valk">0</span>
<button onclick="plus('valk')">+</button>
</div>
</div>

<div class="unit">
<span>🐉 Dragon</span>
<div>
<button onclick="minus('dragon')">−</button>
<span class="number" id="dragon">0</span>
<button onclick="plus('dragon')">+</button>
</div>
</div>

<div class="unit">
<span>🌿 Druid</span>
<div>
<button onclick="minus('druid')">−</button>
<span class="number" id="druid">0</span>
<button onclick="plus('druid')">+</button>
</div>
</div>

<h2>📊 Total Units</h2>

<div id="total">0</div>

</div>

<script>

function plus(id){

let number = document.getElementById(id);

let value = Number(number.innerText);

value = value + 1;

number.innerText = value;

updateTotal();

}

function minus(id){

let number = document.getElementById(id);

let value = Number(number.innerText);

if(value > 0){

value = value - 1;

}

number.innerText = value;

updateTotal();

}

function updateTotal(){

let total = 0;

total += Number(document.getElementById("root").innerText);
total += Number(document.getElementById("valk").innerText);
total += Number(document.getElementById("dragon").innerText);
total += Number(document.getElementById("druid").innerText);

document.getElementById("total").innerText = total;

}

</script>

</body>
</html>
