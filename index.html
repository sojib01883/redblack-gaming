<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Black Gaming | COC TH17 Attack Helper</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    header {
      background: linear-gradient(135deg, #e00000, #111);
      padding: 30px 15px;
      border-bottom: 3px solid #ff0000;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #ddd;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 15px;
    }

    .card {
      background: #171717;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      margin: 15px 0;
      box-shadow: 0 5px 20px rgba(255,0,0,0.15);
    }

    .card h2 {
      color: #ff3030;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #e00000;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff3030;
    }

    .result {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
      text-align: left;
      line-height: 1.7;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      background: #111;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 RED BLACK GAMING 🔥</h1>
    <p>Clash of Clans TH17 Attack Helper</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🏰 TH17 Attack Helper</h2>
      <p>Choose an attack strategy and learn the basic army setup.</p>

      <button onclick="showStrategy('root')">
        🌳 Root Rider + Valkyrie
      </button>

      <button onclick="showStrategy('druid')">
        🌿 Druid + Root Rider
      </button>

      <button onclick="showStrategy('air')">
        🐉 Dragon Air Attack
      </button>

      <div id="strategy" class="result"></div>
    </div>

    <div class="card">
      <h2>⚔️ Attack Tips</h2>

      <button onclick="showTips()">
        📋 Show Attack Tips
      </button>

      <div id="tips" class="result"></div>
    </div>

  </div>

  <footer>
    <p>© 2026 Red Black Gaming</p>
    <p>Made for Clash of Clans players ❤️</p>
  </footer>

  <script>

    function showStrategy(type) {

      const box = document.getElementById("strategy");

      box.style.display = "block";

      if (type === "root") {
        box.innerHTML = `
          <h3>🌳 Root Rider + Valkyrie</h3>
          <p><b>Army idea:</b></p>
          <p>Root Riders + Valkyries + support troops</p>
          <p><b>Basic plan:</b></p>
          <p>1️⃣ Create a funnel.</p>
          <p>2️⃣ Send the main army toward the core.</p>
          <p>3️⃣ Use heroes and spells at the correct timing.</p>
          <p>4️⃣ Save some troops for cleanup.</p>
        `;
      }

      if (type === "druid") {
        box.innerHTML = `
          <h3>🌿 Druid + Root Rider</h3>
          <p><b>Army idea:</b></p>
          <p>Root Riders + Druids + support troops</p>
          <p><b>Basic plan:</b></p>
          <p>1️⃣ Start with a safe funnel.</p>
          <p>2️⃣ Push the main army inside.</p>
          <p>3️⃣ Use Druids to support the army.</p>
          <p>4️⃣ Keep an eye on spell timing.</p>
        `;
      }

      if (type === "air") {
        box.innerHTML = `
          <h3>🐉 Dragon Air Attack</h3>
          <p><b>Army idea:</b></p>
          <p>Dragons + support air troops</p>
          <p><b>Basic plan:</b></p>
          <p>1️⃣ Remove important defenses first.</p>
          <p>2️⃣ Create an air funnel.</p>
          <p>3️⃣ Send Dragons through the base.</p>
          <p>4️⃣ Use air spells carefully.</p>
        `;
      }
    }

    function showTips() {

      const box = document.getElementById("tips");

      box.style.display = "block";

      box.innerHTML = `
        <p>🎯 Study the enemy base before attacking.</p>
        <p>🧠 Plan your funnel first.</p>
        <p>⏱️ Don't use all abilities at once.</p>
        <p>🪄 Save important spells for the core.</p>
        <p>🏆 Always keep cleanup troops.</p>
      `;
    }

  </script>

</body>
</html>
